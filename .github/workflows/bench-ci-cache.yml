name: Bench CI Cache

# Measures the wall-clock cost of the heaviest CI build under the three cache
# configurations being compared for #950's follow-up: no cache at all, rust-cache,
# and sccache (which also caches the C/C++ objects from the bundled DuckDB and
# maplibre-native builds). Dispatch each config at least twice: the first run of a
# caching config populates the cache, the second measures the payoff.

on:
  workflow_dispatch:
    inputs:
      cache_config:
        description: 'Build cache configuration to measure'
        required: true
        type: choice
        options:
          - none
          - rust-cache
          - sccache

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build linux-gnu (${{ inputs.cache_config }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          rendering: "true"
          sccache: ${{ inputs.cache_config == 'sccache' && 'true' || 'false' }}
      # setup-rust's `cache` input skips on workflow_dispatch, so the rust-cache
      # config wires the action directly and always saves.
      - name: Restore rust-cache
        if: inputs.cache_config == 'rust-cache'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning] bench-only build cache on a fork
        with:
          save-if: "true"
          key: bench-ci-cache
      - name: Build x86_64-unknown-linux-gnu
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: just build-release "$TARGET"
      - name: sccache stats
        if: inputs.cache_config == 'sccache'
        run: sccache --show-stats
